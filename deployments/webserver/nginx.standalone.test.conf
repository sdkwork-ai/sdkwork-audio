# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/audio/webserver.pid;
error_log /var/log/sdkwork/audio/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name audio-test.sdkwork.com audio-test.birdcoder.com audio-test.dtupay.com audio-test.sdkwork.cn audio-test.birdcoder.cn audio-test.dtupay.cn audio-test.skubc.com audio-test.skubc.cn audio-test.zowalk.com audio-test.zowalk.cn audio-test.offer86.com audio-test.offer86.cn audio-test.86offer.com audio-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
