# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/audio/webserver.pid;
error_log /var/log/sdkwork/audio/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name audio-demo.sdkwork.com audio-demo.birdcoder.com audio-demo.dtupay.com audio-demo.noaper.com audio-demo.sdkwork.cn audio-demo.birdcoder.cn audio-demo.dtupay.cn audio-demo.noaper.cn audio-demo.skubc.com audio-demo.skubc.cn audio-demo.zowalk.com audio-demo.zowalk.cn audio-demo.offer86.com audio-demo.offer86.cn audio-demo.86offer.com audio-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/audio/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
