version: '3.8'

# Shared log rotation policy (OPERATIONS_SPEC.md §2.3): every service rotates
# at 10MB, keeping 3 files, so container logs cannot fill the host disk.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # SDKWork Audio API Server
  audio-api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=sqlite:/app/data/audio.db
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DRIVE_BASE_URL=http://drive-api:8081
      - IAM_BASE_URL=http://iam-api:8082
    volumes:
      - audio-data:/app/data
    depends_on:
      - drive-api
      - iam-api
    restart: unless-stopped

  # SDKWork Drive API (dependency)
    logging: *default-logging
  drive-api:
    image: sdkwork/drive-api:latest
    ports:
      - "8081:8081"
    environment:
      - RUST_LOG=info
    volumes:
      - drive-data:/app/data
    restart: unless-stopped

  # SDKWork IAM API (dependency)
    logging: *default-logging
  iam-api:
    image: sdkwork/iam-api:latest
    ports:
      - "8082:8082"
    environment:
      - RUST_LOG=info
    volumes:
      - iam-data:/app/data
    restart: unless-stopped

  # Redis for caching
    logging: *default-logging
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    logging: *default-logging

volumes:
  audio-data:
  drive-data:
  iam-data:
  redis-data:
